[project]
name = "hotelfinder"
version = "0.2.0"
description = "CLI hotel/motel deal finder: cheapest option + best overall value"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hotelfinder = "hotelfinder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
