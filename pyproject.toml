[project]
name = "hotel-agent"
version = "0.1.0"
description = "Personal hotel deal agent: search, normalize, effective-cost compare, recommend"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hotel-agent = "hotel_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
