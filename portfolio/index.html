<title>Me Time</title>

<script>
/* ==========================================================================

   YOUR CONTENT  ·  Everything you'll edit lives in this block.

   HOW TO EDIT
   - Change the words between the 'quote marks'. Keep the quote marks.
   - Each entry sits between a { and a } and is followed by a comma.
   - TO ADD AN ENTRY: copy one whole entry, from its { down to its },
     including the comma after it. Paste it right below, then change the words.
   - TO REMOVE AN ENTRY: delete it from its { down to its }, plus the comma.
   - To leave something blank, use two quote marks with nothing between: ''
   - Anything after // on a line is a note for you. The site ignores it.

   IMAGES
   - Make a folder called  images  next to this file and put your pictures in it.
   - Then write the picture's name like this:  'images/my-picture.jpg'
   - Spelling and capital letters must match the file name exactly.
     If a picture can't be found, the site shows "IMAGE NOT FOUND" with the
     name it looked for, so you can spot the typo.

   ========================================================================== */

const SITE = {
  title: 'Me Time',                        // the big animated headline at the top
  name: 'Izaiah Osborn',                   // shown in the menu bar and the footer
  tagline: 'YOUR TAGLINE HERE',            // one short line under the headline, or ''
};

/* --------------------------------------------------------------------------
   PLACES
   Each place is one building in the town AND one section of the page.
   They show up in the town and in the menu in this order.

   The town has room for 6 buildings. To add a building, copy a whole place
   (from its { down to its }, plus the comma) and paste it at the end of the
   list. The new building appears in the next empty spot in town by itself.

   kind  : what the section shows. Pick one:
           'projects'  cards with a picture, description, tags and a link
           'gallery'   a grid of pictures that open larger when clicked
           'links'     a list of big buttons
           'text'      plain paragraphs
   color : the roof color. Pick one:
           'blue', 'cyan', 'cream', 'white', 'teal', 'purple', 'gold', 'red', 'green', 'pink'
   intro : an optional sentence at the top of the section, or ''
   -------------------------------------------------------------------------- */

const PLACES = [

  {
    name: 'PORTFOLIO',
    kind: 'projects',
    color: 'blue',
    intro: '',
    items: [                                // newest project first

      {
        title: 'PROJECT 1',
        year: 'YEAR',
        description: 'A short description of PROJECT 1 goes here.',
        image: '',                          // like 'images/project-1.jpg', or ''
        link: '',                           // like 'https://...', or '' for no button
        tags: ['TAG', 'TAG'],               // or [] for no tags
      },

      {
        title: 'PROJECT 2',
        year: 'YEAR',
        description: 'A short description of PROJECT 2 goes here.',
        image: '',
        link: '',
        tags: ['TAG'],
      },

    ],
  },

  {
    name: 'GALLERY',
    kind: 'gallery',
    color: 'cyan',
    intro: '',
    items: [

      { title: 'IMAGE 1', image: '', caption: '' },
      { title: 'IMAGE 2', image: '', caption: '' },
      { title: 'IMAGE 3', image: '', caption: '' },
      { title: 'IMAGE 4', image: '', caption: '' },

    ],
  },

  {
    name: 'LINKS',
    kind: 'links',
    color: 'cream',
    intro: '',
    items: [

      { label: 'YOUR LINK HERE', url: '' }, // like 'https://instagram.com/yourname'
      { label: 'YOUR LINK HERE', url: '' },
      { label: 'YOUR LINK HERE', url: '' },

    ],
  },

  /* ⬇ EXAMPLE OF A FOURTH BUILDING. To use it, delete this line and the
       "EXAMPLE END" line below, then change the words.

  {
    name: 'ABOUT',
    kind: 'text',
    color: 'white',
    intro: '',
    items: [
      'First paragraph goes here.',
      'Second paragraph goes here.',
    ],
  },

     EXAMPLE END ⬆ */

];

/* ============================  END OF YOUR CONTENT  ======================== */
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one small walkable town on top; each building is a section below it. The sticky menu reaches all of them. */
:root {
  --ink: #0a1a2e;       /* page ground: deep night blue */
  --night: #0f2440;     /* alternate section ground */
  --panel: #153256;     /* window fill */
  --line: #f4ead3;      /* borders and main text: cream */
  --dim: #9dbfdc;       /* secondary text: soft blue */
  --cream: #f3e2bb;     /* headings: warm beige */
  --white: #ffffff;     /* sparkle and glint */
  --tan: #d9c193;       /* labels and small details: deeper beige */
  --cyan: #5fe3f5;      /* small highlights only */
  --blue: #2f7fe0;      /* heading shadow */
  --sky: #a8ecf7;       /* glint and sparkle */
  --shadow: rgba(0, 0, 0, .5);
  --f-display: "Press Start 2P", "Courier New", monospace;
  --f-body: "VT323", "Courier New", monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--ink); scroll-behavior: smooth; }
body {
  margin: 0;
  background-color: var(--ink);
  background-image: radial-gradient(rgba(246, 231, 193, .05) 1px, transparent 1px);
  background-size: 8px 8px;
  color: var(--line);
  font-family: var(--f-body);
  font-size: 22px;
  line-height: 1.3;
  overflow-x: hidden;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100;
  background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0, 0, 0, .12) 2px 3px);
}
a { color: var(--sky); }
:focus-visible { outline: 3px dashed var(--cream); outline-offset: 4px; }
.wrap { max-width: 1120px; margin-inline: auto; padding-inline: 20px; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 60; background: var(--cream); color: var(--ink); font-family: var(--f-display); font-size: 10px; padding: 10px; }
.skip:focus { top: 12px; }

/* Pixel window: notched border from four shadows plus a hard drop shadow */
.win {
  position: relative;
  background: var(--panel);
  box-shadow:
    -4px 0 0 0 var(--line), 4px 0 0 0 var(--line),
    0 -4px 0 0 var(--line), 0 4px 0 0 var(--line),
    10px 10px 0 2px var(--shadow);
}

/* ---------- Menu bar ---------- */
.hud {
  position: sticky; top: 0; z-index: 50;
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--ink); border-bottom: 4px solid var(--line);
  font-family: var(--f-display); font-size: 10px; letter-spacing: .06em;
}
.hud-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 20px; padding-block: 10px; }
.hud-logo { color: var(--cream); text-decoration: none; font-size: 11px; padding-block: 8px; }
.hud-nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.hud-nav::-webkit-scrollbar { display: none; }
.hud-nav a { color: var(--line); text-decoration: none; white-space: nowrap; padding: 8px 10px; }
.hud-nav a::before { content: "▶"; color: var(--cream); margin-right: 6px; visibility: hidden; }
.hud-nav a:hover::before, .hud-nav a:focus-visible::before, .hud-nav a.on::before { visibility: visible; }
.hud-nav a.on { color: var(--cream); }
.hud-nav a:focus-visible { outline-offset: -2px; }

/* ---------- Town ---------- */
.town { position: relative; overflow: hidden; padding-block: 40px 56px; scroll-margin-top: 60px; }
.town > .wrap { position: relative; }
/* Shooting star: drifts slowly across the top of the page while hovering up and down */
.sky { position: absolute; inset: 0 0 auto; height: 160px; pointer-events: none; }
.comet { position: absolute; top: 18px; left: 8%; animation: fly 18s linear infinite; }
.comet-bob { display: block; animation: hover 2.6s ease-in-out infinite; }
.comet .head {
  position: absolute; left: 0; top: 0; width: 6px; height: 6px; background: var(--white);
  box-shadow: 0 -4px 0 -1px var(--cyan), 0 4px 0 -1px var(--cyan), -4px 0 0 -1px var(--cyan), 4px 0 0 -1px var(--cyan), 0 0 12px 3px rgba(95, 227, 245, .6);
  animation: pulse .9s steps(2) infinite;
}
.comet .tail {
  position: absolute; right: 2px; top: 1px; width: 120px; height: 4px;
  background: linear-gradient(to left, var(--white) 0 8%, var(--sky) 8% 30%, rgba(95, 227, 245, .55) 30% 58%, rgba(47, 127, 224, .3) 58% 82%, rgba(47, 127, 224, .1) 82% 100%);
}
.comet .tail::after {
  content: ""; position: absolute; right: 18px; top: -6px; width: 70px; height: 2px;
  background: repeating-linear-gradient(to left, rgba(244, 234, 211, .7) 0 4px, transparent 4px 12px);
  -webkit-mask-image: linear-gradient(to left, #000, transparent); mask-image: linear-gradient(to left, #000, transparent);
}
@keyframes fly { from { transform: translate(-30vw, 0); } to { transform: translate(110vw, 46px); } }
@keyframes hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes pulse { 50% { background: var(--cream); } }
.town:focus { outline: none; }
.town-head { display: grid; gap: 12px; justify-items: center; text-align: center; margin-bottom: 30px; }
.title-box { position: relative; padding: .5em .9em .7em; font-size: clamp(34px, 11vw, 96px); max-width: 100%; }
.town-head h1 {
  margin: 0; font-family: var(--f-display); font-weight: 400;
  font-size: 1em; line-height: 1.15; color: var(--cream); white-space: nowrap;
}
/* Each letter: drops in on load, then bobs in a wave while a glint sweeps across */
.town-head h1 .ch {
  display: inline-block;
  text-shadow: 0 .06em 0 var(--tan), 0 .12em 0 var(--blue), 0 .18em 0 #173a6b, 0 .3em .2em var(--shadow);
  animation:
    drop .8s cubic-bezier(.25, .9, .35, 1) both calc(var(--i) * 80ms),
    bob 2.8s ease-in-out infinite calc(.9s + var(--i) * 140ms),
    glint 4.2s linear infinite calc(1.4s + var(--i) * 90ms);
}
.town-head h1 .sp { display: inline-block; width: .6em; }
@keyframes drop {
  0% { transform: translateY(-1.6em); }
  55% { transform: translateY(.14em); }
  75% { transform: translateY(-.08em); }
  100% { transform: none; }
}
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -.09em; } }
@keyframes glint { 0%, 6%, 100% { color: var(--cream); } 2% { color: var(--white); } 4% { color: var(--sky); } }
/* Pixel sparkles around the title */
.spark {
  position: absolute; width: 4px; height: 4px; color: var(--line); background: currentColor;
  box-shadow: 0 -4px, 0 4px, -4px 0, 4px 0;
  animation: twinkle 2s steps(3) infinite;
}
.spark:nth-child(2) { left: 2%; top: 22%; animation-delay: .3s; }
.spark:nth-child(3) { right: 3%; top: 8%; color: var(--cyan); animation-delay: 1.1s; }
.spark:nth-child(4) { left: 14%; bottom: 4%; color: var(--cream); animation-delay: .7s; }
.spark:nth-child(5) { right: 12%; bottom: 0; animation-delay: 1.6s; }
.spark:nth-child(6) { left: 48%; top: 8%; color: var(--cream); animation-delay: 2.2s; }
@keyframes twinkle { 0%, 100% { transform: scale(.4); opacity: .25; } 50% { transform: scale(1.4); opacity: 1; } }
.town-head p { margin: 0; color: var(--dim); font-size: 24px; }
.world {
  width: min(100%, max(520px, calc((100svh - 300px) * 1.75)));
  margin-inline: auto;
  aspect-ratio: 336 / 192; max-width: 100%;
  cursor: pointer; overflow: hidden; touch-action: manipulation;
}
.world:focus { outline: none; }
.world:focus-visible { outline: 3px dashed var(--cream); outline-offset: 10px; }
#map { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.labels span {
  position: absolute; transform: translate(-50%, -100%);
  font-family: var(--f-display); font-size: clamp(6px, 1.05vw, 11px);
  color: var(--ink); background: var(--line); padding: .4em .55em; white-space: nowrap;
  box-shadow: 0 .3em 0 rgba(0, 0, 0, .4);
}
.wipe {
  position: absolute; inset: 0; background: var(--ink);
  clip-path: circle(0% at var(--x, 50%) var(--y, 50%));
}
.wipe.run { animation: iris .42s steps(7) forwards; }
@keyframes iris { to { clip-path: circle(150% at var(--x, 50%) var(--y, 50%)); } }
.under { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 20px 40px; margin-top: 30px; }
.hint { margin: 0; color: var(--dim); font-size: 20px; text-align: center; max-width: 46ch; }
.hint kbd { font-family: var(--f-body); font-size: 22px; line-height: 1; color: var(--cream); background: var(--ink); border: 2px solid var(--dim); padding: 0 6px; }
.hint .coarse { display: none; }

/* Touch pad */
.pad { display: none; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); user-select: none; -webkit-user-select: none; touch-action: none; }
.pad button {
  font-family: var(--f-display); font-size: 14px; color: var(--line);
  background: #1d4473; border: 0; cursor: pointer; touch-action: none;
  box-shadow: inset -4px -4px 0 rgba(0, 0, 0, .35), inset 4px 4px 0 rgba(255, 255, 255, .08);
}
.pad button.down { background: #3f8fe0; box-shadow: inset 4px 4px 0 rgba(0, 0, 0, .35); }
.pad [data-dir="up"] { grid-area: 1 / 2; }
.pad [data-dir="left"] { grid-area: 2 / 1; }
.pad [data-dir="right"] { grid-area: 2 / 3; }
.pad [data-dir="down"] { grid-area: 3 / 2; }
.pad .hub { grid-area: 2 / 2; background: #1d4473; }
@media (pointer: coarse), (max-width: 760px) {
  .pad { display: grid; }
  .hint .fine { display: none; }
  .hint .coarse { display: inline; }
}

/* ---------- Sections ---------- */
.stage { padding-block: 64px; scroll-margin-top: 60px; }
.stage:nth-child(odd) { background: var(--night); }
.stage:focus { outline: none; }
.stage-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 32px; }
.stage-head > div { display: grid; gap: 10px; min-width: 0; }
.eyebrow { font-family: var(--f-display); font-size: 10px; letter-spacing: .14em; color: var(--tan); }
.stage-head h2 {
  margin: 0; font-family: var(--f-display); font-weight: 400;
  font-size: clamp(22px, 4.4vw, 36px); color: var(--cream);
  text-shadow: 4px 4px 0 var(--blue); text-wrap: balance; overflow-wrap: anywhere;
}
.stage-head p { margin: 0; color: var(--dim); max-width: 62ch; }
.back { font-family: var(--f-display); font-size: 10px; color: var(--line); text-decoration: none; padding: 8px 0; }
.back:hover { color: var(--cream); }
.stage.arrive .stage-head h2 { animation: arrive .6s steps(3) 2; }
@keyframes arrive { 50% { color: var(--white); text-shadow: 4px 4px 0 var(--cyan); } }
.empty { color: var(--dim); }

/* Placeholder art for missing pictures */
.ph {
  width: 100%; height: 100%; display: grid; place-items: center; text-align: center; padding: 12px;
  background-color: #173863;
  background-image: conic-gradient(#1f4574 25%, transparent 0 50%, #1f4574 0 75%, transparent 0);
  background-size: 24px 24px;
  font-family: var(--f-display); font-size: 9px; line-height: 1.7; color: var(--dim);
  overflow-wrap: anywhere;
}
.ph span { background: var(--ink); padding: 6px 8px; }
.ph.missing span { color: #ff8a9a; }

/* Projects */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 40px 36px; }
.card { display: flex; flex-direction: column; min-width: 0; }
.card .thumb { aspect-ratio: 16 / 10; max-width: 100%; overflow: hidden; background: var(--ink); border-bottom: 4px solid var(--line); }
.card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .body { display: flex; flex-direction: column; gap: 12px; padding: 18px 18px 20px; flex: 1; }
.card h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 13px; line-height: 1.5; color: var(--cream); text-wrap: balance; overflow-wrap: anywhere; }
.card .year { font-family: var(--f-display); font-size: 9px; color: var(--tan); }
.card p { margin: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.tags li { font-family: var(--f-display); font-size: 8px; padding: 6px 7px; background: var(--ink); color: var(--tan); border: 2px solid rgba(217, 193, 147, .4); }
.go {
  margin-top: auto; align-self: flex-start;
  font-family: var(--f-display); font-size: 10px; color: var(--ink); background: var(--cream);
  padding: 10px 12px; text-decoration: none; box-shadow: 4px 4px 0 var(--blue);
}
.go:hover { background: var(--line); }

/* Gallery */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 200px), 1fr)); gap: 18px; }
.tile {
  aspect-ratio: 1; max-width: 100%; padding: 0; border: 0; cursor: zoom-in; overflow: hidden;
  background: var(--ink); box-shadow: 0 0 0 4px var(--line), 6px 6px 0 4px var(--shadow);
  transition: transform .12s steps(2);
}
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile:hover, .tile:focus-visible { transform: translate(-3px, -3px); box-shadow: 0 0 0 4px var(--cream), 9px 9px 0 4px var(--shadow); outline: none; }

/* Links */
.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 22px; max-width: 620px; }
.link {
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  font-family: var(--f-display); font-size: 12px; line-height: 1.5; color: var(--line); text-decoration: none;
  padding: 18px 20px; overflow-wrap: anywhere;
}
.link::after { content: "▶"; color: var(--cream); flex: none; }
a.link:hover, a.link:focus-visible { color: var(--cream); }
a.link:hover::after { transform: translateX(4px); }
.link.blank { color: var(--dim); }
.link.blank::after { content: "NO URL YET"; font-size: 8px; color: var(--dim); }

/* Text */
.text { padding: 26px 28px; display: grid; gap: 14px; }
.text p { margin: 0; max-width: 64ch; }

/* Lightbox */
dialog.lb {
  width: min(94vw, 1000px); max-height: 94svh; padding: 0; border: 4px solid var(--line);
  background: var(--ink); color: var(--line);
}
dialog.lb::backdrop { background: rgba(4, 14, 28, .88); }
.lb-media { display: grid; place-items: center; background: #061322; }
.lb-media img { display: block; max-width: 100%; max-height: 74svh; object-fit: contain; }
.lb-media .ph { aspect-ratio: 4 / 3; max-height: 74svh; font-size: 11px; }
.lb-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-top: 4px solid var(--line); }
.lb-cap { min-width: 0; flex: 1 1 200px; }
.lb-cap b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 11px; color: var(--cream); margin-bottom: 6px; overflow-wrap: anywhere; }
.lb-cap span { color: var(--dim); font-size: 20px; }
.lb-btns { display: flex; gap: 8px; align-items: center; }
.lb-btns button { font-family: var(--f-display); font-size: 11px; color: var(--ink); background: var(--line); border: 0; padding: 10px 12px; cursor: pointer; }
.lb-btns button:hover { background: var(--cream); }
.lb-count { font-family: var(--f-display); font-size: 9px; color: var(--dim); font-variant-numeric: tabular-nums; margin-right: 6px; }

/* Footer */
.foot { border-top: 4px solid var(--line); padding-block: 36px 48px; }
.foot .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; font-family: var(--f-display); font-size: 9px; color: var(--dim); }
.foot a { color: var(--line); text-decoration: none; }

@media (max-width: 520px) {
  body { font-size: 20px; }
  .wrap { padding-inline: 16px; }
  .town { padding-block: 28px 44px; }
  .text { padding: 20px; }
  .hud { font-size: 8px; }
  .hud-nav a { padding: 8px 6px; }
  .hud-nav a::before { margin-right: 4px; }
  .pad { grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<a class="skip" href="#sections">Skip the town</a>

<header class="hud">
  <div class="wrap hud-in">
    <a class="hud-logo" href="#town" id="logo"></a>
    <nav class="hud-nav" id="menu" aria-label="Menu"></nav>
  </div>
</header>

<main>
  <section class="town" id="town" tabindex="-1" aria-labelledby="siteName">
    <div class="sky" aria-hidden="true"><div class="comet"><span class="comet-bob"><i class="tail"></i><i class="head"></i></span></div></div>
    <div class="wrap">
      <div class="town-head">
        <div class="title-box">
          <h1 id="siteName"></h1>
          <span class="spark" aria-hidden="true"></span><span class="spark" aria-hidden="true"></span><span class="spark" aria-hidden="true"></span><span class="spark" aria-hidden="true"></span><span class="spark" aria-hidden="true"></span>
        </div>
        <p id="tagline"></p>
      </div>
      <div class="world win" id="world" tabindex="0" role="application"
           aria-label="Town map. Use arrow keys to walk. Walk into a door to open that section. Every section is also in the menu.">
        <canvas id="map" width="336" height="192"></canvas>
        <div class="labels" id="labels" aria-hidden="true"></div>
        <div class="wipe" id="wipe" hidden></div>
      </div>
      <div class="under">
        <p class="hint">
          <span class="fine"><kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> or click to walk. Walk into a door to go inside.</span>
          <span class="coarse">Tap anywhere in town to walk there, or use the pad. Walk into a door to go inside.</span>
        </p>
        <div class="pad" id="pad" aria-label="Walking pad">
          <button type="button" data-dir="up" aria-label="Walk up">▲</button>
          <button type="button" data-dir="left" aria-label="Walk left">◀</button>
          <span class="hub" aria-hidden="true"></span>
          <button type="button" data-dir="right" aria-label="Walk right">▶</button>
          <button type="button" data-dir="down" aria-label="Walk down">▼</button>
        </div>
      </div>
    </div>
  </section>

  <div id="sections"></div>
</main>

<footer class="foot">
  <div class="wrap"><span id="copy"></span><a href="#town" data-back>▲ BACK TO TOWN</a></div>
</footer>

<dialog class="lb" id="lightbox" aria-label="Picture viewer">
  <div class="lb-media" id="lbMedia"></div>
  <div class="lb-bar">
    <div class="lb-cap" id="lbCap"></div>
    <div class="lb-btns">
      <span class="lb-count" id="lbCount"></span>
      <button type="button" id="lbPrev" aria-label="Previous picture">◀</button>
      <button type="button" id="lbNext" aria-label="Next picture">▶</button>
      <button type="button" id="lbClose" aria-label="Close">✕</button>
    </div>
  </div>
</dialog>

<script>
(() => {
'use strict';

const $ = (s, el = document) => el.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ROOFS = {
  red: ['#e0424f', '#9e2438'], teal: ['#2bb8a0', '#1a7a6a'], purple: ['#8a4fff', '#5a2bb8'],
  gold: ['#e8a417', '#a8700a'], cream: ['#efdcb2', '#bfa679'], white: ['#f2f6fb', '#aebfd3'], cyan: ['#4fd6ea', '#2192aa'], blue: ['#3f7cff', '#2550b8'], green: ['#4caf50', '#2e7a32'], pink: ['#ff6bb5', '#b83a7a'],
};
const NOUNS = { projects: 'PROJECT', gallery: 'IMAGE', links: 'LINK' };

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else n.setAttribute(k, v);
  }
  kids.flat().forEach(k => k != null && n.append(k));
  return n;
}

/* ---------- Places: give each one a section id and roof colors ---------- */
const used = new Set();
const places = (typeof PLACES !== 'undefined' && Array.isArray(PLACES) ? PLACES : []).map((p, i) => {
  let id = String(p.name || `place-${i + 1}`).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || `place-${i + 1}`;
  while (used.has(id) || id === 'town' || id === 'sections') id += '-2';
  used.add(id);
  return { ...p, name: String(p.name || 'PLACE'), id, items: Array.isArray(p.items) ? p.items : [], roof: ROOFS[p.color] || ROOFS.red };
});

/* ---------- Pictures (with a labeled stand-in when missing) ---------- */
function placeholder(label, missing) {
  return el('div', { class: missing ? 'ph missing' : 'ph' }, el('span', { text: label }));
}
function picture(src, alt, emptyLabel) {
  if (!src) return placeholder(emptyLabel);
  const img = el('img', { src, alt: alt || '', loading: 'lazy' });
  img.addEventListener('error', () => img.replaceWith(placeholder(`IMAGE NOT FOUND: ${src}`, true)), { once: true });
  return img;
}

/* ---------- Sections ---------- */
function renderProjects(p) {
  if (!p.items.length) return el('p', { class: 'empty', text: 'No projects yet.' });
  return el('div', { class: 'cards' }, p.items.map(it => {
    const title = it.title || 'UNTITLED';
    return el('article', { class: 'card win' },
      el('div', { class: 'thumb' }, picture(it.image, title, 'NO IMAGE YET')),
      el('div', { class: 'body' },
        it.year ? el('span', { class: 'year', text: it.year }) : null,
        el('h3', { text: title }),
        it.description ? el('p', { text: it.description }) : null,
        it.tags && it.tags.length ? el('ul', { class: 'tags' }, it.tags.map(t => el('li', { text: t }))) : null,
        it.link ? el('a', { class: 'go', href: it.link, target: '_blank', rel: 'noopener', text: 'VIEW PROJECT ▶' }) : null));
  }));
}

function renderGallery(p) {
  if (!p.items.length) return el('p', { class: 'empty', text: 'No images yet.' });
  return el('div', { class: 'grid' }, p.items.map((it, i) => {
    const title = it.title || `IMAGE ${i + 1}`;
    const b = el('button', { class: 'tile', type: 'button', 'aria-label': `Open ${title}` }, picture(it.image, title, title));
    b.addEventListener('click', () => openLightbox(p.items, i));
    return b;
  }));
}

function renderLinks(p) {
  if (!p.items.length) return el('p', { class: 'empty', text: 'No links yet.' });
  return el('ul', { class: 'links' }, p.items.map(it => {
    const label = it.label || it.url || 'LINK';
    return el('li', {}, it.url
      ? el('a', { class: 'link win', href: it.url, target: '_blank', rel: 'noopener', text: label })
      : el('span', { class: 'link win blank', text: label }));
  }));
}

function renderText(p) {
  return el('div', { class: 'win text' }, p.items.map(t => el('p', { text: t })));
}

const RENDER = { projects: renderProjects, gallery: renderGallery, links: renderLinks, text: renderText };

function renderPage() {
  const site = typeof SITE !== 'undefined' && SITE ? SITE : {};
  const name = site.name || '';
  const title = site.title || name;
  document.title = title;
  const h1 = $('#siteName');
  h1.setAttribute('aria-label', title);
  [...title.toUpperCase()].forEach((ch, i) => {
    const s = el('span', { class: ch === ' ' ? 'sp' : 'ch', 'aria-hidden': 'true', text: ch === ' ' ? '' : ch });
    s.style.setProperty('--i', i);
    h1.append(s);
  });
  $('#logo').textContent = name.toUpperCase();
  $('#copy').textContent = `© ${new Date().getFullYear()} ${name.toUpperCase()}`;
  const tag = site.tagline || '';
  $('#tagline').textContent = tag; $('#tagline').hidden = !tag;

  const menu = $('#menu');
  menu.append(el('a', { href: '#town', text: 'TOWN' }));
  const host = $('#sections');
  places.forEach(p => {
    menu.append(el('a', { href: `#${p.id}`, text: p.name }));
    const noun = NOUNS[p.kind];
    const n = p.items.length;
    const head = el('header', { class: 'stage-head' },
      el('div', {},
        noun ? el('span', { class: 'eyebrow', text: `${n} ${noun}${n === 1 ? '' : 'S'}` }) : null,
        el('h2', { id: `${p.id}-h`, text: p.name }),
        p.intro ? el('p', { text: p.intro }) : null),
      el('a', { class: 'back', href: '#town', 'data-back': '', text: '◀ BACK TO TOWN' }));
    const body = (RENDER[p.kind] || renderText)(p);
    host.append(el('section', { class: 'stage', id: p.id, tabindex: '-1', 'aria-labelledby': `${p.id}-h` },
      el('div', { class: 'wrap' }, head, body)));
  });
}

/* ---------- Lightbox ---------- */
const lb = $('#lightbox');
let lbItems = [], lbIndex = 0;
function showLb(i) {
  lbIndex = (i + lbItems.length) % lbItems.length;
  const it = lbItems[lbIndex];
  const title = it.title || `IMAGE ${lbIndex + 1}`;
  $('#lbMedia').replaceChildren(picture(it.image, title, title));
  $('#lbCap').replaceChildren(el('b', { text: title }), it.caption ? el('span', { text: it.caption }) : '');
  $('#lbCount').textContent = `${lbIndex + 1} / ${lbItems.length}`;
  const many = lbItems.length > 1;
  $('#lbPrev').hidden = !many; $('#lbNext').hidden = !many; $('#lbCount').hidden = !many;
}
function openLightbox(items, i) {
  lbItems = items; showLb(i);
  if (lb.showModal) lb.showModal(); else lb.setAttribute('open', '');
}
$('#lbPrev').addEventListener('click', () => showLb(lbIndex - 1));
$('#lbNext').addEventListener('click', () => showLb(lbIndex + 1));
$('#lbClose').addEventListener('click', () => lb.close());
lb.addEventListener('click', e => { if (e.target === lb) lb.close(); });
lb.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') showLb(lbIndex - 1);
  if (e.key === 'ArrowRight') showLb(lbIndex + 1);
});

/* ---------- Moving between town and sections ---------- */
function goToSection(id) {
  const sec = document.getElementById(id);
  if (!sec) return;
  sec.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
  sec.focus({ preventScroll: true });
  sec.classList.remove('arrive'); void sec.offsetWidth; sec.classList.add('arrive');
  setTimeout(() => sec.classList.remove('arrive'), 1400);
}

/* ==========================================================================
   TOWN
   The town has 6 building lots. Places fill them in the order of LOTS, so
   three buildings make a balanced triangle and more fill in around them.
   Empty lots get a pond or a grove of trees instead.
   ========================================================================== */
const TS = 16, COLS = 21, ROWS = 12;
const LOTS = [
  { c: 2, r: 2 },   // top left
  { c: 16, r: 2 },  // top right
  { c: 9, r: 7 },   // bottom middle
  { c: 2, r: 7 },   // bottom left
  { c: 16, r: 7 },  // bottom right
  { c: 9, r: 2 },   // top middle
];
const START = { x: 10, y: 5 };
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };

const PAL = { R: '#f3e2bb', K: '#0a1a2e', S: '#f2b78c', T: '#5fe3f5', B: '#2f7fe0', N: '#6b4220' };
const HERO = {
  down: ['...RRRR...', '..RRRRRR..', '.RRRRRRRR.', '..KSSSSK..', '..SKSSKS..', '..SSSSSS..', '...SSSS...', '..TTTTTT..', '.STTTTTTS.', '.S.TTTT.S.', '...BBBB...'],
  up: ['...RRRR...', '..RRRRRR..', '..RRRRRR..', '..KKKKKK..', '..KKKKKK..', '..SKKKKS..', '...SSSS...', '..TTTTTT..', '.STTTTTTS.', '.S.TTTT.S.', '...BBBB...'],
  side: ['...RRRR...', '..RRRRRR..', '..RRRRRRRR', '..KKSSSS..', '..KSSKSS..', '..SSSSSS..', '...SSSS...', '...TTTT...', '..TTTTTS..', '...TTTSS..', '...BBBB...'],
  legs: [['..NN..NN..'], ['..NN...NN.'], ['.NN...NN..']],
};

function drawSprite(g, rows, x, y, flip = false) {
  rows.forEach((r, j) => {
    const row = flip ? [...r].reverse().join('') : r;
    for (let i = 0; i < row.length; i++) {
      if (row[i] === '.') continue;
      g.fillStyle = PAL[row[i]];
      g.fillRect(x + i, y + j, 1, 1);
    }
  });
}
function hash(x, y, i = 0) {
  let h = x * 374761393 + y * 668265263 + i * 2147483647;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}

function buildTown() {
  const placed = places.slice(0, LOTS.length).map((p, i) => {
    const lot = LOTS[i];
    return { ...p, lot, door: { x: lot.c + 1, y: lot.r + 2 } };
  });
  const grid = Array.from({ length: ROWS }, (_, y) => Array.from({ length: COLS }, (_, x) =>
    (x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1) ? 't' : 'g'));
  const inLot = (x, y) => LOTS.some(l => x >= l.c && x < l.c + 3 && y >= l.r && y < l.r + 3);
  for (let x = 1; x < COLS - 1; x++) { grid[5][x] = 'p'; grid[10][x] = 'p'; }
  for (let y = 6; y < 10; y++) { grid[y][6] = 'p'; grid[y][14] = 'p'; }
  LOTS.forEach((l, i) => {
    if (placed[i]) {
      for (let dy = 0; dy < 3; dy++) for (let dx = 0; dx < 3; dx++) grid[l.r + dy][l.c + dx] = 'b';
      grid[l.r + 2][l.c + 1] = 'd';
    } else if (l.r === 2 && l.c === 9) {
      for (let dx = 0; dx < 3; dx++) { grid[l.r][l.c + dx] = 'w'; grid[l.r + 1][l.c + dx] = 'w'; }
      grid[l.r + 2][l.c] = 'f'; grid[l.r + 2][l.c + 2] = 'f';
    } else {
      grid[l.r][l.c] = 't'; grid[l.r][l.c + 2] = 't'; grid[l.r + 1][l.c + 1] = 't';
      grid[l.r + 2][l.c] = 'f'; grid[l.r + 2][l.c + 2] = 'f';
    }
  });
  for (let y = 1; y < ROWS - 1; y++) for (let x = 1; x < COLS - 1; x++) {
    if (grid[y][x] === 'g' && !inLot(x, y) && hash(x, y, 77) < .08) grid[y][x] = 'f';
  }
  return { grid, placed };
}

function paintStatic(grid, placed) {
  const c = document.createElement('canvas'); c.width = COLS * TS; c.height = ROWS * TS;
  const g = c.getContext('2d');
  const grass = (x, y) => {
    g.fillStyle = '#3f9b4b'; g.fillRect(x * TS, y * TS, TS, TS);
    for (let i = 0; i < 7; i++) {
      g.fillStyle = hash(x, y, i) < .5 ? '#2f7d3b' : '#5cbd5a';
      g.fillRect(x * TS + (hash(x, y, i + 9) * 15 | 0), y * TS + (hash(x, y, i + 20) * 15 | 0), 1, 2);
    }
  };
  const path = (x, y) => {
    g.fillStyle = '#d9b679'; g.fillRect(x * TS, y * TS, TS, TS);
    for (let i = 0; i < 5; i++) {
      g.fillStyle = '#c29a5a';
      g.fillRect(x * TS + (hash(x, y, i + 3) * 15 | 0), y * TS + (hash(x, y, i + 30) * 15 | 0), 2, 1);
    }
  };
  const tree = (x, y) => {
    grass(x, y);
    const X = x * TS, Y = y * TS;
    g.fillStyle = '#6b4220'; g.fillRect(X + 6, Y + 11, 4, 5);
    for (let j = 0; j < 13; j++) for (let i = 0; i < 16; i++) {
      const d = Math.hypot(i - 7.5, j - 6);
      if (d > 7) continue;
      g.fillStyle = d < 4 && i < 8 && j < 6 ? '#3aa04e' : (d > 6 ? '#14502a' : '#1f6b34');
      g.fillRect(X + i, Y + j, 1, 1);
    }
  };
  const flower = (x, y) => {
    grass(x, y);
    const cols = ['#f3e2bb', '#ffffff', '#5fe3f5'];
    for (let i = 0; i < 3; i++) {
      const fx = x * TS + 3 + (hash(x, y, i + 40) * 10 | 0), fy = y * TS + 3 + (hash(x, y, i + 50) * 10 | 0);
      g.fillStyle = cols[i]; g.fillRect(fx, fy, 2, 2);
      g.fillStyle = '#2f7d3b'; g.fillRect(fx, fy + 2, 1, 2);
    }
  };
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const t = grid[y][x];
    if (t === 't') tree(x, y);
    else if (t === 'p') path(x, y);
    else if (t === 'f') flower(x, y);
    else if (t !== 'w') grass(x, y);
  }
  // pond rim (water itself shimmers, so it's drawn every frame)
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (grid[y][x] !== 'w') continue;
    g.fillStyle = '#8f7a55'; g.fillRect(x * TS - 1, y * TS - 1, TS + 2, TS + 2);
  }
  for (const b of placed) {
    const X = b.lot.c * TS, Y = b.lot.r * TS, W = 3 * TS;
    const [roof, dark] = b.roof;
    g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(X + 4, Y + 22, W, 28);
    g.fillStyle = '#f3dfb0'; g.fillRect(X + 2, Y + 18, W - 4, 30);
    g.fillStyle = '#d8bf86'; g.fillRect(X + 2, Y + 44, W - 4, 4);
    g.fillStyle = dark; g.fillRect(X - 2, Y + 6, W + 4, 14);
    g.fillStyle = roof; g.fillRect(X - 2, Y + 4, W + 4, 12); g.fillRect(X + 3, Y, W - 6, 6); g.fillRect(X + 9, Y - 4, W - 18, 6);
    g.fillStyle = dark;
    for (let i = 0; i < W + 4; i += 6) g.fillRect(X - 2 + i, Y + 9, 3, 1);
    for (let i = 3; i < W - 6; i += 6) g.fillRect(X + 3 + i, Y + 3, 3, 1);
    [[X + 6, Y + 24], [X + W - 14, Y + 24]].forEach(([wx, wy]) => {
      g.fillStyle = '#5a3a1a'; g.fillRect(wx - 1, wy - 1, 10, 10);
      g.fillStyle = '#6fb6ff'; g.fillRect(wx, wy, 8, 8);
      g.fillStyle = '#5a3a1a'; g.fillRect(wx + 3, wy, 2, 8); g.fillRect(wx, wy + 3, 8, 2);
    });
    const dx = X + TS + 3, dy = Y + 30;
    g.fillStyle = '#4a2a12'; g.fillRect(dx - 1, dy - 1, 12, 19);
    g.fillStyle = '#7a4a22'; g.fillRect(dx, dy, 10, 18);
    g.fillStyle = '#ffcc33'; g.fillRect(dx + 7, dy + 9, 2, 2);
    // doormat
    g.fillStyle = dark; g.fillRect(dx - 1, Y + 48, 12, 2);
  }
  return c;
}

function initTown() {
  const world = $('#world'), canvas = $('#map'), g = canvas.getContext('2d'), wipe = $('#wipe');
  const { grid, placed } = buildTown();
  const staticLayer = paintStatic(grid, placed);
  const doorAt = {};
  placed.forEach(p => { doorAt[`${p.door.x},${p.door.y}`] = p; });

  const labels = $('#labels');
  placed.forEach(p => {
    const s = el('span', { text: p.name });
    s.style.left = `${(p.lot.c + 1.5) / COLS * 100}%`;
    s.style.top = `${(p.lot.r * TS - 5) / (ROWS * TS) * 100}%`;
    labels.append(s);
  });

  const walkable = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS && 'gpf'.includes(grid[y][x]);
  const P = { tx: START.x, ty: START.y, x: START.x * TS, y: START.y * TS, dir: 'down', moving: false, fx: 0, fy: 0, t: 0, step: 0, goal: null };
  const held = [];
  let entering = false, visible = false, running = false, last = 0;

  function enter(place) {
    if (entering) return;
    entering = true; held.length = 0; P.goal = null; P.dir = 'down';
    const done = () => { wipe.hidden = true; wipe.classList.remove('run'); entering = false; goToSection(place.id); };
    if (reduced) { done(); return; }
    wipe.style.setProperty('--x', `${(place.door.x + .5) / COLS * 100}%`);
    wipe.style.setProperty('--y', `${(place.door.y + .5) / ROWS * 100}%`);
    wipe.hidden = false; wipe.classList.remove('run'); void wipe.offsetWidth; wipe.classList.add('run');
    setTimeout(done, 460);
  }

  // shortest path (breadth-first) toward a goal tile; returns the first direction to step
  function nextStep(fromX, fromY, toX, toY) {
    const key = (x, y) => y * COLS + x;
    const prev = new Map([[key(fromX, fromY), null]]);
    const q = [[fromX, fromY]];
    while (q.length) {
      const [x, y] = q.shift();
      if (x === toX && y === toY) {
        let k = key(x, y), before = prev.get(k);
        while (before !== null && before !== key(fromX, fromY)) { k = before; before = prev.get(k); }
        const kx = k % COLS, ky = (k / COLS) | 0;
        return Object.keys(DIRS).find(d => fromX + DIRS[d][0] === kx && fromY + DIRS[d][1] === ky);
      }
      for (const [dx, dy] of Object.values(DIRS)) {
        const nx = x + dx, ny = y + dy, k = key(nx, ny);
        if (walkable(nx, ny) && !prev.has(k)) { prev.set(k, key(x, y)); q.push([nx, ny]); }
      }
    }
    return null;
  }

  function tryStep(dir) {
    const [dx, dy] = DIRS[dir];
    P.dir = dir;
    const nx = P.tx + dx, ny = P.ty + dy;
    const door = doorAt[`${nx},${ny}`];
    if (door) { enter(door); return; }
    if (walkable(nx, ny)) { P.moving = true; P.fx = dx; P.fy = dy; P.t = 0; P.step++; }
  }

  function update(dt) {
    if (entering) return;
    if (P.moving) {
      P.t += dt / 0.14;
      if (P.t >= 1) { P.moving = false; P.tx += P.fx; P.ty += P.fy; P.x = P.tx * TS; P.y = P.ty * TS; }
      else { P.x = (P.tx + P.fx * P.t) * TS; P.y = (P.ty + P.fy * P.t) * TS; }
    }
    if (P.moving) return;
    if (held.length) { P.goal = null; tryStep(held[held.length - 1]); return; }
    if (P.goal) {
      const { x, y, place } = P.goal;
      if (P.tx === x && P.ty === y) { P.goal = null; if (place) tryStep('up'); return; }
      const d = nextStep(P.tx, P.ty, x, y);
      if (d) tryStep(d); else P.goal = null;
    }
  }

  function draw(now) {
    const t = now / 1000;
    g.drawImage(staticLayer, 0, 0);
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (grid[y][x] !== 'w') continue;
      g.fillStyle = '#2f6fd6'; g.fillRect(x * TS, y * TS, TS, TS);
      g.fillStyle = '#6fa8ff';
      for (let k = 0; k < 2; k++) {
        const wx = ((x * TS + k * 8 + (reduced ? 0 : t * 6) + (y % 2) * 5) % TS) | 0;
        g.fillRect(x * TS + wx, y * TS + 4 + k * 7, 4, 1);
      }
    }
    // goal marker
    if (P.goal && !P.goal.place) {
      g.fillStyle = Math.sin(t * 10) > 0 ? '#f3e2bb' : '#ffffff';
      const gx = P.goal.x * TS, gy = P.goal.y * TS;
      g.fillRect(gx + 3, gy + 3, 3, 1); g.fillRect(gx + 3, gy + 3, 1, 3);
      g.fillRect(gx + 10, gy + 3, 3, 1); g.fillRect(gx + 12, gy + 3, 1, 3);
      g.fillRect(gx + 3, gy + 12, 3, 1); g.fillRect(gx + 3, gy + 10, 1, 3);
      g.fillRect(gx + 10, gy + 12, 3, 1); g.fillRect(gx + 12, gy + 10, 1, 3);
    }
    const px = Math.round(P.x) + 3, py = Math.round(P.y) + 3;
    const frame = P.moving ? (P.t < .5 ? 1 + (P.step % 2) : 0) : 0;
    const bob = P.moving && frame ? -1 : 0;
    g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(px + 1, py + 11, 8, 2);
    const body = P.dir === 'up' ? HERO.up : P.dir === 'down' ? HERO.down : HERO.side;
    const flip = P.dir === 'left';
    drawSprite(g, body, px, py + bob - 1, flip);
    drawSprite(g, HERO.legs[frame], px, py + bob + 10, flip);
  }

  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
    update(dt); draw(now);
    if (visible) requestAnimationFrame(loop); else running = false;
  }
  new IntersectionObserver(([e]) => {
    visible = e.isIntersecting;
    if (visible && !running) { running = true; last = performance.now(); requestAnimationFrame(loop); }
  }).observe(world);
  draw(performance.now());

  // keyboard: only while the town has focus, so arrow keys still scroll the page elsewhere
  world.addEventListener('keydown', e => {
    const dir = KEYS[e.code];
    if (dir) { e.preventDefault(); if (!held.includes(dir)) held.push(dir); }
    else if (e.code === 'Enter' || e.code === 'Space') {
      e.preventDefault();
      const [dx, dy] = DIRS[P.dir];
      const door = doorAt[`${P.tx + dx},${P.ty + dy}`];
      if (door && !P.moving) enter(door);
    }
  });
  const release = dir => { const i = held.indexOf(dir); if (i >= 0) held.splice(i, 1); };
  window.addEventListener('keyup', e => { if (KEYS[e.code]) release(KEYS[e.code]); });
  window.addEventListener('blur', () => { held.length = 0; });
  world.addEventListener('focusout', () => { held.length = 0; });

  // click or tap to walk; tapping a building walks to its door and goes in
  canvas.addEventListener('click', e => {
    const r = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / r.width * COLS);
    const y = Math.floor((e.clientY - r.top) / r.height * ROWS);
    const place = placed.find(p => x >= p.lot.c && x < p.lot.c + 3 && y >= p.lot.r - 1 && y < p.lot.r + 3);
    if (place) P.goal = { x: place.door.x, y: place.door.y + 1, place };
    else if (walkable(x, y)) P.goal = { x, y };
  });

  // on-screen pad
  $('#pad').querySelectorAll('button').forEach(b => {
    const dir = b.dataset.dir;
    const up = () => { b.classList.remove('down'); release(dir); };
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      b.classList.add('down');
      if (!held.includes(dir)) held.push(dir);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, up));
    b.addEventListener('contextmenu', e => e.preventDefault());
  });

  return { focus: () => world.focus({ preventScroll: true }) };
}

/* ---------- Boot ---------- */
renderPage();
const town = initTown();

if (matchMedia('(pointer: fine)').matches) town.focus();

document.addEventListener('click', e => {
  const back = e.target.closest('[data-back]');
  if (!back) return;
  e.preventDefault();
  $('#town').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
  town.focus();
});

const links = [...document.querySelectorAll('.hud-nav a')];
const spy = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === `#${e.target.id}`));
  });
}, { rootMargin: '-45% 0px -50% 0px' });
document.querySelectorAll('.town, .stage').forEach(s => spy.observe(s));
})();
</script>
